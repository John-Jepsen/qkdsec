[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "qkdsec"
dynamic = ["version"]
description = "A developer toolkit for Quantum Key Distribution: numerical security proofs, BB84 simulation, and a full ETSI GS QKD 014 client with built-in conformance probe"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "John Jepsen", email = "jjepsen15@protonmail.com" },
]
keywords = ["qkd", "quantum", "cryptography", "bb84", "etsi", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
proofs = [
    "cvxpy>=1.5",
    "numpy>=1.24",
    "scipy>=1.10",
]
proofs-mosek = ["mosek>=10"]
proofs-diff = ["cvxpylayers>=0.1.6", "torch>=2"]
sim = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
]
async = [
    "httpx>=0.27",
]
cli = [
    "typer>=0.12",
    "rich>=13",
]
# The doctor probe runs on the sync client; it needs only the CLI deps.
doctor = ["qkdsec[cli]"]
# The mock KME server needs Flask on top of the CLI deps.
mock = ["flask>=3", "qkdsec[cli]"]
docs = [
    "sphinx>=7",
    "furo>=2024.5",
    "myst-parser>=3",
    "sphinx-autodoc-typehints>=2",
    "sphinx-copybutton>=0.5",
]
all = ["qkdsec[proofs,sim,async,cli,mock]"]
test = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "responses>=0.24",
    "respx>=0.21",
]
dev = [
    "qkdsec[test]",
    "ruff>=0.6",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
qkdsec = "qkdsec._cli:app"

[project.urls]
Homepage = "https://github.com/John-Jepsen/qkdsec"
Repository = "https://github.com/John-Jepsen/qkdsec"
Issues = "https://github.com/John-Jepsen/qkdsec/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qkdsec*"]

[tool.setuptools.package-data]
qkdsec = ["py.typed"]

# Version is derived from git tags (v0.2.0 -> 0.2.0). Between tags, builds get
# a dev version like 0.2.1.dev3+g2d48e42 so every commit is uniquely versioned.
[tool.setuptools_scm]
version_file = "src/qkdsec/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative CLI style requires function calls in defaults
"src/qkdsec/_cli.py" = ["B008"]
